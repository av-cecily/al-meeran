<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Al Meeran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #1A2238; transition: background 0.5s; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 10px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-[#1A2238]">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="max-w-md w-full glass p-12 rounded-[40px] text-center shadow-2xl relative z-50">
        <div class="w-20 h-20 bg-[#C5A059] rounded-full flex items-center justify-center mx-auto mb-8 shadow-xl">
            <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-2xl font-black text-white uppercase tracking-tighter mb-2">Admin Dashboard</h1>
        <p class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-10">Authorized Personnel Only</p>
        
        <div class="space-y-4 text-left">
            <input type="text" id="admin-user" placeholder="Username" class="w-full bg-white/5 border border-white/10 rounded-xl py-4 px-6 text-white outline-none focus:border-[#C5A059]">
            <div class="relative">
                <input type="password" id="admin-pass" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-xl py-4 px-6 text-white outline-none focus:border-[#C5A059]">
                <button onclick="togglePass('admin-pass')" class="absolute right-4 top-4 text-gray-500 hover:text-white"><i data-lucide="eye" class="w-5 h-5"></i></button>
            </div>
            <div class="text-right">
                <button onclick="openModal('forget-modal')" class="text-[9px] font-bold text-gray-500 uppercase tracking-widest hover:text-[#C5A059] transition">Forget Password?</button>
            </div>
            <button id="login-btn" onclick="login()" class="w-full bg-[#C5A059] text-white py-4 rounded-xl font-bold uppercase tracking-widest text-[10px] mt-2 hover:scale-[1.02] transition-all">Login</button>
        </div>
        <p id="error-msg" class="text-red-400 text-[10px] font-bold uppercase mt-6 hidden">Invalid Credentials</p>
    </div>

    <!-- OTP RESET MODAL -->
    <div id="forget-modal" class="fixed inset-0 bg-[#1A2238]/95 backdrop-blur-md hidden flex items-center justify-center z-[200]">
        <div class="bg-white w-full max-w-sm rounded-[30px] p-10 text-center shadow-2xl">
            <div class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="lock" class="w-5 h-5 text-[#C5A059]"></i></div>
            <h3 class="text-xl font-black uppercase tracking-tighter mb-2" id="reset-modal-title">Password Recovery</h3>
            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest mb-8" id="reset-modal-desc">Verification code will be sent to primary email</p>
            <div id="step-send-otp" class="space-y-4 text-left"><input type="text" id="otp-user" value="admin" class="w-full border border-gray-100 rounded-xl py-3 px-6 text-xs outline-none bg-gray-50" readonly><button id="send-otp-btn" onclick="requestOTP()" class="w-full bg-[#1A2238] text-white py-4 rounded-xl font-bold uppercase tracking-widest text-[10px]">Send Code</button></div>
            <div id="step-verify-otp" class="hidden space-y-4 text-left"><input type="text" id="verify-otp-input" placeholder="6-Digit Code" class="w-full border border-gray-100 rounded-xl py-3 px-6 text-xs outline-none focus:border-[#C5A059]"><button id="verify-otp-btn" onclick="verifyOTP()" class="w-full bg-[#1A2238] text-white py-4 rounded-xl font-bold uppercase tracking-widest text-[10px]">Verify Code</button></div>
            <div id="step-change-pass" class="hidden space-y-4 text-left"><input type="password" id="reset-new-pass" placeholder="Enter New Password" class="w-full border border-gray-100 rounded-xl py-3 px-6 text-xs outline-none focus:border-[#C5A059]"><button id="reset-btn" onclick="finalReset()" class="w-full bg-[#C5A059] text-white py-4 rounded-xl font-bold uppercase tracking-widest text-[10px]">Update Password</button></div>
            <button onclick="closeModal('forget-modal')" class="mt-6 text-[9px] font-black uppercase tracking-widest text-gray-400 hover:text-red-500 transition">Cancel</button>
        </div>
    </div>

    <script>
        const getToken = () => sessionStorage.getItem('token');
        function togglePass(id) { const i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; }
        
        async function login() {
            const u = document.getElementById('admin-user').value; const p = document.getElementById('admin-pass').value;
            const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
            if (r.ok) { const d = await r.json(); sessionStorage.setItem('token', d.token); window.location.href = 'dashboard.html'; }
            else document.getElementById('error-msg').classList.remove('hidden');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
        
        async function requestOTP() {
            const u = 'admin'; const b = event.target; b.textContent = 'Sending...';
            const r = await fetch('/api/admin/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u}) });
            if(r.ok) { document.getElementById('step-send-otp').classList.add('hidden'); document.getElementById('step-verify-otp').classList.remove('hidden'); }
        }
        async function verifyOTP() {
            const u = 'admin'; const o = document.getElementById('verify-otp-input').value;
            const r = await fetch('/api/admin/verify-otp', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, otp:o}) });
            if(r.ok) { window.storedOTP = o; document.getElementById('step-verify-otp').classList.add('hidden'); document.getElementById('step-change-pass').classList.remove('hidden'); }
        }
        async function finalReset() {
            const u = 'admin'; const p = document.getElementById('reset-new-pass').value;
            const r = await fetch('/api/admin/verify-reset', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, otp:window.storedOTP, new_password:p}) });
            if(r.ok) { alert("Updated!"); location.reload(); }
        }

        window.onload = () => { if(getToken()) window.location.href = 'dashboard.html'; else lucide.createIcons(); };
    </script>
</body>
</html>
