<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Al Meeran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8F9FA; transition: background 0.5s; }
        .tab-btn.active { background: #C5A059; color: white; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 10px; }
    </style>
</head>
<body class="text-[#1A2238]">

    <!-- UNIVERSAL ADD MODAL -->
    <div id="add-modal" class="fixed inset-0 bg-[#1A2238]/95 backdrop-blur-md hidden flex items-center justify-center z-[200]">
        <div class="bg-white w-full max-w-md rounded-[30px] p-10 shadow-2xl">
            <h3 class="text-xl font-black uppercase mb-6" id="add-modal-title">Add New Item</h3>
            <form id="add-form" class="space-y-4">
                <input type="text" name="name" id="item-name-input" placeholder="Name / Title" required class="w-full border border-gray-100 rounded-xl py-3 px-6 text-xs outline-none focus:border-[#C5A059]">
                
                <!-- Category Select -->
                <div class="space-y-2">
                    <label class="text-[9px] font-bold uppercase tracking-widest text-gray-400 ml-1">Category</label>
                    <select name="category" id="item-category-select" class="w-full border border-gray-100 rounded-xl py-3 px-6 text-xs outline-none focus:border-[#C5A059] bg-white">
                        <!-- Dynamic options -->
                    </select>
                </div>

                <div class="border-2 border-dashed p-10 rounded-xl text-center relative hover:bg-gray-50 transition group">
                    <i data-lucide="image-plus" class="w-8 h-8 mx-auto text-gray-300 group-hover:text-[#C5A059] mb-2"></i>
                    <p id="file-status" class="text-[10px] font-bold text-gray-400 uppercase">Click to Select Image</p>
                    <input type="file" name="image" accept="image/*" required class="absolute inset-0 opacity-0 cursor-pointer" onchange="document.getElementById('file-status').textContent = this.files[0].name; document.getElementById('file-status').classList.add('text-[#C5A059]')">
                </div>
                <input type="hidden" name="price" value="0">
                <button type="submit" class="w-full bg-[#1A2238] text-white py-4 rounded-xl font-bold uppercase tracking-widest text-[10px] shadow-xl hover:bg-[#C5A059] transition">Save & Publish</button>
            </form>
            <button onclick="closeModal('add-modal')" class="w-full mt-4 text-[9px] font-bold text-gray-400 uppercase tracking-widest hover:text-red-500">Cancel</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="fixed inset-0 bg-[#F8F9FA] flex overflow-hidden">
        <aside class="w-72 bg-[#1A2238] text-white flex flex-col shadow-2xl z-20">
            <div class="p-10 border-b border-white/5"><span class="text-xl font-black tracking-tighter block uppercase">AL MEERAN</span></div>
            <nav class="flex-grow p-6 space-y-2">
                <button onclick="showTab('dashboard')" id="btn-dashboard" class="tab-btn active w-full flex items-center p-4 rounded-xl text-xs font-bold uppercase tracking-widest transition hover:text-white"><i data-lucide="layout-dashboard" class="w-4 h-4 mr-3"></i> Overview</button>
                <button onclick="showTab('orders')" id="btn-orders" class="tab-btn w-full flex items-center p-4 rounded-xl text-gray-400 text-xs font-bold uppercase tracking-widest transition hover:text-white"><i data-lucide="package" class="w-4 h-4 mr-3"></i> Requests</button>
                <button onclick="showTab('quotes')" id="btn-quotes" class="tab-btn w-full flex items-center p-4 rounded-xl text-gray-400 text-xs font-bold uppercase tracking-widest transition hover:text-white"><i data-lucide="mail" class="w-4 h-4 mr-3"></i> Quotes</button>
                <div class="h-px bg-white/5 my-4 mx-4"></div>
                <button onclick="showTab('fabrics')" id="btn-fabrics" class="tab-btn w-full flex items-center p-4 rounded-xl text-gray-400 text-xs font-bold uppercase tracking-widest transition hover:text-white"><i data-lucide="layers" class="w-4 h-4 mr-3"></i> Fabrics</button>
                <button onclick="showTab('gallery')" id="btn-gallery" class="tab-btn w-full flex items-center p-4 rounded-xl text-gray-400 text-xs font-bold uppercase tracking-widest transition hover:text-white"><i data-lucide="image" class="w-4 h-4 mr-3"></i> Gallery</button>
            </nav>
            <div class="p-10 border-t border-white/5"><button onclick="logout()" class="text-gray-500 hover:text-red-400 text-[10px] font-bold uppercase tracking-widest flex items-center"><i data-lucide="log-out" class="w-4 h-4 mr-2"></i> Log Out</button></div>
        </aside>

        <main class="flex-grow overflow-y-auto p-12 text-[#1A2238]">
            <header class="flex justify-between items-center mb-12">
                <div><h2 id="tab-title" class="text-3xl font-black uppercase tracking-tighter">Overview</h2></div>
                <button id="add-btn" onclick="openAddModal()" class="hidden bg-[#1A2238] text-white px-8 py-4 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-xl hover:bg-[#C5A059] transition-all">Add New</button>
            </header>
            <div id="analytics-view" class="grid grid-cols-3 gap-8 mb-12">
                <div class="bg-white p-8 rounded-[30px] border border-gray-100 shadow-sm"><p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Fabrics</p><h3 id="stat-products" class="text-4xl font-black">0</h3></div>
                <div class="bg-white p-8 rounded-[30px] border border-gray-100 shadow-sm"><p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Orders</p><h3 id="stat-orders" class="text-4xl font-black">0</h3></div>
                <div class="bg-white p-8 rounded-[30px] border border-gray-100 shadow-sm"><p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Quotes</p><h3 id="stat-quotes" class="text-4xl font-black">0</h3></div>
            </div>
            <div id="list-view" class="bg-white rounded-[40px] shadow-sm border border-gray-100 overflow-hidden min-h-[500px] hidden">
                <table class="w-full text-left">
                    <thead id="table-head" class="bg-gray-50 text-[10px] font-black uppercase tracking-widest text-gray-400 sticky top-0 z-10"></thead>
                    <tbody id="admin-table-body" class="text-sm"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="details-modal" class="fixed inset-0 bg-[#1A2238]/90 hidden flex items-center justify-center z-[100] backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-3xl p-10 relative shadow-2xl">
            <button onclick="closeModal('details-modal')" class="absolute top-6 right-6 text-gray-400 hover:text-red-500 transition"><i data-lucide="x" class="w-6 h-6"></i></button>
            <h3 id="modal-title" class="text-2xl font-black uppercase tracking-tighter mb-6">Details</h3>
            <div id="modal-content" class="space-y-4 text-sm mb-8"></div>
        </div>
    </div>

    <script>
        const getToken = () => sessionStorage.getItem('token');
        async function apiFetch(url, opts = {}) { 
            const t = getToken(); 
            opts.headers = { ...opts.headers, 'Authorization': `Bearer ${t}` }; 
            const r = await fetch(url, opts); 
            if (r.status === 401) logout(); 
            return r; 
        }
        
        function logout() { sessionStorage.clear(); window.location.href = 'login.html'; }

        let currentTab = 'dashboard';
        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'text-white'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.add('text-gray-400'));
            document.getElementById('btn-' + tab).classList.add('active', 'text-white');
            document.getElementById('btn-' + tab).classList.remove('text-gray-400');
            
            document.getElementById('analytics-view').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('list-view').classList.toggle('hidden', tab === 'dashboard');
            document.getElementById('add-btn').classList.toggle('hidden', !['fabrics', 'gallery'].includes(tab));
            
            const headers = { dashboard: 'Overview', orders: 'Requests', quotes: 'Quotes', fabrics: 'Fabrics', gallery: 'Gallery' };
            document.getElementById('tab-title').textContent = headers[tab];
            
            if (tab === 'dashboard') loadAnalytics(); else loadData(tab);
        }

        function openAddModal() {
            const select = document.getElementById('item-category-select');
            select.innerHTML = '';
            
            const opts = currentTab === 'fabrics' 
                ? ['Luxury', 'Modern', 'Durable', 'Classic']
                : ['Classic', 'Modern', 'Luxury'];

            opts.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o; opt.textContent = o;
                select.appendChild(opt);
            });

            document.getElementById('add-modal-title').textContent = currentTab === 'fabrics' ? 'Add New Fabric' : 'Add Gallery Project';
            document.getElementById('item-name-input').placeholder = currentTab === 'fabrics' ? 'Enter Fabric Name' : 'Enter Project Title';
            document.getElementById('add-form').reset();
            document.getElementById('file-status').textContent = 'Click to Select Image';
            openModal('add-modal');
        }

        document.getElementById('add-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const endpoint = currentTab === 'fabrics' ? '/api/products' : '/api/gallery';
            if (currentTab === 'gallery') formData.append('title', formData.get('name'));
            const res = await apiFetch(endpoint, { method: 'POST', body: formData });
            if (res.ok) { alert("Success!"); closeModal('add-modal'); loadData(currentTab); }
        };

        async function loadAnalytics() {
            const r = await apiFetch('/api/analytics'); const d = await r.json();
            document.getElementById('stat-products').textContent = d.stats.products;
            document.getElementById('stat-orders').textContent = d.stats.orders;
            document.getElementById('stat-quotes').textContent = d.stats.quotes;
        }

        async function loadData(tab) {
            const tbody = document.getElementById('admin-table-body'); const thead = document.getElementById('table-head');
            const endpoints = { orders: '/api/orders', quotes: '/api/quotes', fabrics: '/api/products', gallery: '/api/gallery' };
            const r = await apiFetch(endpoints[tab]); const data = await r.json(); window.currentData = data;
            
            if (tab === 'fabrics' || tab === 'gallery') {
                thead.innerHTML = `<tr><th class="p-6 pl-10 text-[9px] uppercase tracking-widest text-gray-400">Preview</th><th class="p-6 text-[9px] uppercase tracking-widest text-gray-400">Name</th><th class="p-6 text-[9px] uppercase tracking-widest text-gray-400">Category</th><th class="p-6 text-center text-[9px] uppercase tracking-widest text-gray-400">Action</th></tr>`;
                tbody.innerHTML = data.map(f => `<tr class="border-b"><td class="p-4 pl-10"><img src="/${f.image_url}" class="w-10 h-10 rounded-lg object-cover"></td><td class="p-6 font-bold text-xs uppercase">${f.name || f.title}</td><td class="p-6"><span class="px-3 py-1 bg-gray-100 rounded-full text-[9px] font-black uppercase text-gray-500">${f.category}</span></td><td class="p-6 text-center"><button onclick="deleteItem(${f.id}, '${tab === 'fabrics' ? 'products' : 'gallery'}')" class="text-red-400 hover:text-red-600 transition"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></button></td></tr>`).join('');
            } else {
                thead.innerHTML = `<tr><th class="p-6 pl-10 text-[9px] uppercase tracking-widest text-gray-400">Customer</th><th class="p-6 text-center text-[9px] uppercase tracking-widest text-gray-400">Action</th></tr>`;
                tbody.innerHTML = data.map((o, i) => `<tr class="border-b"><td class="p-6 pl-10 font-bold text-xs">${o.customer_name || o.name}</td><td class="p-6 text-center"><button onclick="viewDetails(${i})" class="bg-gray-100 px-4 py-2 rounded text-[10px] font-bold">VIEW</button></td></tr>`).join('');
            }
            lucide.createIcons();
        }

        async function deleteItem(id, type) { if (confirm('Delete?')) { await apiFetch(`/api/${type}/${id}`, { method: 'DELETE' }); loadData(currentTab); } }
        function viewDetails(i) {
            const d = window.currentData[i]; const c = document.getElementById('modal-content');
            if (currentTab === 'orders') {
                c.innerHTML = `<div class="grid grid-cols-2 gap-4"><div><p class="text-[10px] text-gray-400 uppercase">Customer</p><p class="font-bold">${d.customer_name}</p></div><div><p class="text-[10px] text-gray-400 uppercase">Phone</p><p class="font-bold">${d.phone}</p></div><div class="col-span-2"><p class="text-[10px] text-gray-400 uppercase">Address</p><p class="font-bold bg-gray-50 p-4 rounded text-xs">${d.address || 'N/A'}</p></div></div>`;
            } else {
                c.innerHTML = `<div><p class="font-bold text-lg mb-2">${d.name}</p><p class="text-xs text-gray-500 mb-4">${d.service_type}</p><p class="bg-gray-50 p-4 rounded italic text-xs">"${d.message}"</p>${d.image_url ? `<img src="${d.image_url}" class="mt-4 rounded-xl w-full h-48 object-cover">`:''}</div>`;
            }
            openModal('details-modal');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
        
        window.onload = () => { if(!getToken()) window.location.href = 'login.html'; else { showTab('dashboard'); lucide.createIcons(); } };
    </script>
</body>
</html>
